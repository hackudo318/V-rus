<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otimização do Sistema</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .box {
    text-align: center;
    background: #020617;
    padding: 25px;
    border-radius: 15px;
    width: 90%;
    max-width: 350px;
    box-shadow: 0 0 30px rgba(0,255,0,0.2);
  }
  button {
    background: #16a34a;
    border: none;
    padding: 15px;
    border-radius: 10px;
    color: white;
    font-size: 18px;
    cursor: pointer;
    width: 100%;
  }
  .progress {
    width: 100%;
    height: 20px;
    background: #1e293b;
    border-radius: 10px;
    margin-top: 20px;
    overflow: hidden;
    display: none;
  }
  .bar {
    height: 100%;
    width: 0%;
    background: #22c55e;
  }
  .msg {
    margin-top: 15px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="box">
  <h2>🔋 Otimização do Sistema</h2>
  <p>Clique abaixo para limpar ameaças ocultas</p>
  <button onclick="iniciar()">INICIAR VARREDURA</button>

  <div class="progress">
    <div class="bar"></div>
  </div>

  <div class="msg"></div>
</div>

<script>
function iniciar() {
  document.querySelector("button").style.display = "none";
  const progress = document.querySelector(".progress");
  const bar = document.querySelector(".bar");
  const msg = document.querySelector(".msg");
  progress.style.display = "block";

  let width = 0;
  let mensagens = [
    "Analisando arquivos do sistema...",
    "Detectado: 3.421 ameaças ⚠️",
    "Injetando correções...",
    "Acesso ao núcleo do Android...",
    "Erro crítico detectado ❌",
    "Enviando dados do sistema...",
    "Finalizando processo..."
  ];
  let i = 0;

  let interval = setInterval(() => {
    width++;
    bar.style.width = width + "%";

    if (width % 15 === 0 && i < mensagens.length) {
      msg.innerText = mensagens[i];
      i++;
    }

    if (width >= 100) {
      clearInterval(interval);
      msg.innerHTML = "<strong>😂 PEGADINHA!</strong><br>Relaxa, não tem vírus nenhum.";
    }
  }, 60);
}
</script>

</body>
</html>
